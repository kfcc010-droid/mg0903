<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MG 금융계산기</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        mggreen: { 50: '#ecfdf5', 100: '#d1fae5', 400: '#34d399', 500: '#059669', 600: '#047857' },
                        mgblue: { 50: '#eff6ff', 800: '#1e40af', 900: '#1e3a8a' },
                    },
                    fontFamily: {
                        sans: ['Noto Sans KR', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="text-slate-800 antialiased">

    <!-- Navigation -->
    <nav class="bg-mgblue-900/95 backdrop-blur border-b border-white/10 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- 로고 영역 -->
                <div class="flex items-center gap-3">
                    <div class="text-mggreen-400 font-black text-2xl tracking-tighter">MG</div>
                    <div class="text-white font-bold text-lg">스마트 금융계산기</div>
                </div>
                
                <!-- 우측 상단 버튼 영역 -->
                <div class="flex items-center gap-4">
                    <!-- 요청하신 메인 페이지 이동 홈 버튼 -->
                    <a href="https://kfcc010-droid.github.io/mg0903/" class="bg-white/20 hover:bg-white/30 text-white px-4 py-2 rounded-lg text-sm font-bold transition-colors shadow-sm flex items-center">
                        <span class="mr-1.5">🏠</span>홈으로 돌아가기
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 sm:px-6 py-12">
        <div class="text-center mb-10">
            <h1 class="text-3xl font-black text-mgblue-900 mb-3">대출 이자 계산기</h1>
            <p class="text-slate-500">상환 방식에 따른 월 납입금과 총 이자를 미리 계산해 보세요.</p>
        </div>

        <div class="bg-white rounded-2xl shadow-lg border border-slate-200 overflow-hidden">
            <div class="grid grid-cols-1 md:grid-cols-2">
                
                <!-- 입력 폼 영역 -->
                <div class="p-8 bg-slate-50 border-r border-slate-200">
                    <form id="calcForm" class="space-y-6">
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-2">대출 금액</label>
                            <div class="relative">
                                <input type="number" id="principal" class="w-full pl-4 pr-12 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-mggreen-500 focus:border-mggreen-500 outline-none transition" value="30000000" step="1000000">
                                <span class="absolute right-4 top-3 text-slate-500 font-medium">원</span>
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-2">대출 기간</label>
                            <div class="relative">
                                <input type="number" id="period" class="w-full pl-4 pr-12 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-mggreen-500 focus:border-mggreen-500 outline-none transition" value="10">
                                <span class="absolute right-4 top-3 text-slate-500 font-medium">년</span>
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-2">연 이자율</label>
                            <div class="relative">
                                <input type="number" id="rate" class="w-full pl-4 pr-12 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-mggreen-500 focus:border-mggreen-500 outline-none transition" value="4.5" step="0.1">
                                <span class="absolute right-4 top-3 text-slate-500 font-medium">%</span>
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-2">상환 방식</label>
                            <select id="type" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-mggreen-500 focus:border-mggreen-500 outline-none transition bg-white cursor-pointer">
                                <option value="equal_pr">원리금균등분할상환</option>
                                <option value="equal_p">원금균등분할상환</option>
                                <option value="bullet">만기일시상환</option>
                            </select>
                        </div>
                    </form>
                </div>

                <!-- 결과 표시 영역 -->
                <div class="p-8 flex flex-col justify-center bg-white">
                    <h3 class="text-lg font-bold text-slate-800 mb-6 border-b pb-2">예상 계산 결과</h3>
                    
                    <div class="space-y-6">
                        <div class="bg-mgblue-50 p-4 rounded-xl border border-mgblue-100">
                            <div class="text-sm font-medium text-mgblue-800 mb-1">월 평균 상환액 (초회차 기준)</div>
                            <div class="text-3xl font-black text-mgblue-900"><span id="monthlyPayment">0</span> <span class="text-lg font-bold text-mgblue-700">원</span></div>
                        </div>

                        <div class="flex justify-between items-center py-2 border-b border-dashed border-slate-200">
                            <span class="text-slate-600 font-medium">총 이자액</span>
                            <span class="text-lg font-bold text-slate-800"><span id="totalInterest">0</span> 원</span>
                        </div>
                        
                        <div class="flex justify-between items-center py-2 border-b border-dashed border-slate-200">
                            <span class="text-slate-600 font-medium">총 상환금액 (원금+이자)</span>
                            <span class="text-lg font-bold text-mggreen-600"><span id="totalPayment">0</span> 원</span>
                        </div>
                    </div>

                    <div class="mt-8 text-xs text-slate-400 leading-relaxed">
                        * 본 결과는 예상치이므로 실제 대출 실행 시 영업점의 산출 결과와 차이가 발생할 수 있습니다.
                    </div>
                </div>
                
            </div>
        </div>
    </main>

    <script>
        // 간단한 대출 계산 로직 구현
        function calculateLoan() {
            const principal = parseFloat(document.getElementById('principal').value);
            const years = parseFloat(document.getElementById('period').value);
            const annualRate = parseFloat(document.getElementById('rate').value) / 100;
            const type = document.getElementById('type').value;

            const months = years * 12;
            const monthlyRate = annualRate / 12;
            
            let monthlyPayment = 0;
            let totalInterest = 0;

            if (isNaN(principal) || isNaN(years) || isNaN(annualRate) || principal <= 0 || years <= 0) {
                return; // 잘못된 입력 방지
            }

            if (type === 'equal_pr') {
                // 원리금균등
                monthlyPayment = principal * (monthlyRate * Math.pow(1 + monthlyRate, months)) / (Math.pow(1 + monthlyRate, months) - 1);
                totalInterest = (monthlyPayment * months) - principal;
            } else if (type === 'equal_p') {
                // 원금균등 (첫 달 상환액 기준 표시, 총 이자 계산)
                const monthlyPrincipal = principal / months;
                monthlyPayment = monthlyPrincipal + (principal * monthlyRate); // 첫 달
                
                // 총 이자: 원금 * 연이율 * (개월수+1) / 24
                totalInterest = principal * annualRate * (months + 1) / 24;
            } else if (type === 'bullet') {
                // 만기일시
                monthlyPayment = principal * monthlyRate;
                totalInterest = monthlyPayment * months;
            }

            const totalPayment = principal + totalInterest;

            document.getElementById('monthlyPayment').innerText = Math.floor(monthlyPayment).toLocaleString();
            document.getElementById('totalInterest').innerText = Math.floor(totalInterest).toLocaleString();
            document.getElementById('totalPayment').innerText = Math.floor(totalPayment).toLocaleString();
        }

        // 이벤트 리스너 등록
        document.getElementById('calcForm').addEventListener('input', calculateLoan);
        document.getElementById('type').addEventListener('change', calculateLoan);
        
        // 초기 로딩 시 계산 실행
        calculateLoan();
    </script>
</body>
</html>
